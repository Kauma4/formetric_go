openapi: 3.1.0
info:
  title: API Приложения для Аутентификации и Опросов
  description: API для управления опросами, вопросами, ответами, аутентификацией пользователей и аналитикой.
  version: 1.0.0
servers:
  - url: /api
    description: Основной сервер API
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Сообщение об ошибке
        details:
          type: string
          description: Детали ошибки (опционально)
      required:
        - error
    Survey:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор опроса
        title:
          type: string
          description: Название опроса
        description:
          type: string
          description: Описание опроса
        created_by:
          type: integer
          description: ID пользователя, создавшего опрос
        created_at:
          type: string
          format: date-time
          description: Дата создания
        max_ball:
          type: integer
          description: Максимальный балл за опрос
      required:
        - title
    Question:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор вопроса
        survey_id:
          type: integer
          description: ID опроса
        question_text:
          type: string
          description: Текст вопроса
        is_required:
          type: boolean
          description: Обязателен ли вопрос
        is_test:
          type: boolean
          description: Является ли вопрос тестовым
        ball:
          type: integer
          description: Баллы за вопрос
        correct_answer:
          type: string
          description: Правильный ответ (для текстовых вопросов)
        answers:
          type: array
          items:
            $ref: '#/components/schemas/AnswerOption'
          description: Варианты ответов (для тестовых вопросов)
      required:
        - survey_id
        - question_text
    AnswerOption:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор варианта ответа
        answer_text:
          type: string
          description: Текст ответа
        correct:
          type: boolean
          description: Является ли ответ правильным
      required:
        - answer_text
    UserAnswer:
      type: object
      properties:
        question_id:
          type: integer
          description: ID вопроса
        answer_id:
          type: integer
          description: ID выбранного ответа (для тестовых вопросов)
        answer_text:
          type: string
          description: Текстовый ответ (для текстовых вопросов)
      required:
        - question_id
    User:
      type: object
      properties:
        id:
          type: integer
          description: Идентификатор пользователя
        username:
          type: string
          description: Имя пользователя
        email:
          type: string
          description: Email
        full_name:
          type: string
          description: Полное имя
        avatar_url:
          type: string
          description: URL аватара
        phone_number:
          type: string
          description: Номер телефона
        date_of_birth:
          type: string
          format: date
          description: Дата рождения
        location:
          type: string
          description: Местоположение
      required:
        - id
        - username
    RegisterInput:
      type: object
      properties:
        username:
          type: string
          description: Имя пользователя
        password:
          type: string
          description: Пароль
        email:
          type: string
          description: Email (опционально)
      required:
        - username
        - password
    LoginCredentials:
      type: object
      properties:
        username:
          type: string
          description: Имя пользователя или email
        password:
          type: string
          description: Пароль
      required:
        - username
        - password
    SurveyAnalytics:
      type: object
      properties:
        survey:
          $ref: '#/components/schemas/Survey'
          description: Информация об опросе
        total_responses:
          type: integer
          description: Общее количество ответов
        average_score:
          type: number
          format: float
          description: Средний балл
        participants:
          type: array
          items:
            type: object
            properties:
              username:
                type: string
                description: Имя пользователя
              total_ball:
                type: integer
                description: Общий балл
              date:
                type: string
                format: date-time
                description: Дата ответа
          description: Участники опроса
        questions:
          type: array
          items:
            type: object
            properties:
              question:
                $ref: '#/components/schemas/Question'
                description: Вопрос
              correct_rate:
                type: number
                format: float
                description: Процент правильных ответов
              answer_stats:
                type: array
                items:
                  type: object
                  properties:
                    answer_text:
                      type: string
                      description: Текст ответа
                    count:
                      type: integer
                      description: Количество выборов
                    is_correct:
                      type: boolean
                      description: Правильный ли ответ
                description: Статистика по вариантам ответа
              text_responses:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                      description: Имя пользователя
                    answer:
                      type: string
                      description: Текстовый ответ
                description: Текстовые ответы
          description: Статистика по вопросам
paths:
  /register:
    post:
      summary: Регистрация нового пользователя
      description: Создает нового пользователя с указанным именем и паролем.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '200':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Сообщение об успехе
        '400':
          description: Неверный запрос или имя/email уже заняты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка базы данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:
      summary: Вход пользователя
      description: Аутентифицирует пользователя и возвращает JWT-токен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginCredentials'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Сообщение об успехе
                  token:
                    type: string
                    description: JWT-токен
                  email_sent:
                    type: boolean
                    description: Был ли токен отправлен на email
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user:
    get:
      summary: Получение профиля пользователя
      description: Возвращает данные текущего пользователя.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Профиль пользователя успешно получен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка базы данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Обновление профиля пользователя
      description: Обновляет данные профиля текущего пользователя.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: Новый email
                full_name:
                  type: string
                  description: Новое полное имя
                avatar_url:
                  type: string
                  description: Новый URL аватара
                phone_number:
                  type: string
                  description: Новый номер телефона
                date_of_birth:
                  type: string
                  format: date
                  description: Новая дата рождения
                location:
                  type: string
                  description: Новое местоположение
      responses:
        '200':
          description: Профиль успешно обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверный формат данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удаление пользователя
      description: Выполняет мягкое удаление учетной записи пользователя.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Аккаунт успешно деактивирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  user_id:
                    type: integer
                  deleted_at:
                    type: string
                    format: date-time
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Пользователь уже удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/avatar:
    post:
      summary: Загрузка аватара пользователя
      description: Загружает изображение аватара для текущего пользователя.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Файл изображения (JPEG, PNG, GIF, до 2 МБ)
      responses:
        '200':
          description: Аватар успешно загружен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  avatar_url:
                    type: string
        '400':
          description: Неверный формат файла или превышен размер
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /user/results:
    get:
      summary: Получение результатов пользователя
      description: Возвращает результаты опросов текущего пользователя.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Результаты успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    survey_id:
                      type: integer
                    total_score:
                      type: integer
                    date:
                      type: string
                      format: date-time
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Результаты не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /survey:
    post:
      summary: Создание нового опроса
      description: Создает новый опрос для текущего пользователя.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Survey'
      responses:
        '200':
          description: Опрос успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  survey_id:
                    type: integer
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /survey/{id}:
    put:
      summary: Обновление опроса
      description: Обновляет данные опроса и его вопросы.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Название опроса
                description:
                  type: string
                  description: Описание опроса
                questions:
                  type: array
                  items:
                    $ref: '#/components/schemas/Question'
                  description: Список вопросов
      responses:
        '200':
          description: Опрос успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  survey_id:
                    type: integer
                  updated_questions:
                    type: integer
        '400':
          description: Неверный формат данных или ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет прав на редактирование
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Удаление опроса
      description: Удаляет опрос, если пользователь является его создателем.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      responses:
        '200':
          description: Опрос успешно удален
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deleted_id:
                    type: integer
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /survey/{id}/answers/simple:
    get:
      summary: Получение ответов пользователя на опрос
      description: Возвращает ответы текущего пользователя на указанный опрос.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      responses:
        '200':
          description: Ответы успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  survey_id:
                    type: integer
                  user_id:
                    type: integer
                  answers:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAnswer'
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /survey/{id}/answers/user:
    post:
      summary: Получение ответов конкретного пользователя
      description: Возвращает ответы указанного пользователя на опрос (для создателя опроса).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: ID пользователя
              required:
                - user_id
      responses:
        '200':
          description: Ответы успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  survey_id:
                    type: integer
                  user_id:
                    type: integer
                  answers:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAnswer'
        '400':
          description: Неверный ID или запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Пользователь не является создателем опроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Опрос не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /survey/{id}/results:
    get:
      summary: Получение результатов опроса
      description: Возвращает результаты опроса для текущего пользователя.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      responses:
        '200':
          description: Результаты успешно получены
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id:
                      type: integer
                    total_score:
                      type: integer
                    date:
                      type: string
                      format: date-time
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Результаты не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /surveys:
    get:
      summary: Получение списка всех опросов
      description: Возвращает список всех доступных опросов.
      responses:
        '200':
          description: Список опросов успешно получен
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Survey'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /surveys/{id}/questions:
    get:
      summary: Получение вопросов опроса
      description: Возвращает список вопросов для указанного опроса.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      responses:
        '200':
          description: Вопросы успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Question'
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /surveys/{id}/participants:
    get:
      summary: Получение участников опроса
      description: Возвращает список участников указанного опроса (для создателя).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID опроса
      responses:
        '200':
          description: Участники успешно получены
          content:
            application/json:
              schema:
                type: object
                properties:
                  survey_id:
                    type: integer
                  participants:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id:
                          type: integer
                        username:
                          type: string
                        total_ball:
                          type: integer
                        date:
                          type: string
                          format: date-time
        '400':
          description: Неверный ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Нет доступа
          content:
            application/json:
              schema:
